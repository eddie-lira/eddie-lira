<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
  <title id="t">Hey, I'm Eddie Lira. I'm a software engineer.</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    </filter>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FCFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FCFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- gradient: sky blue base, hot pink bloom -->
    <rect width="1200" height="420" fill="#0593C6"/>
    <g filter="url(#blur)">
      <ellipse cx="760" cy="300" rx="330" ry="190" fill="#D83995"/>
      <ellipse cx="980" cy="90" rx="220" ry="140" fill="#D83995" opacity="0.7"/>
      <ellipse cx="150" cy="60" rx="320" ry="170" fill="#0476A0"/>
      <ellipse cx="560" cy="160" rx="160" ry="110" fill="#FCFFFF" opacity="0.35"/>
    </g>
    <!-- grain -->
    <rect width="1200" height="420" filter="url(#grain)" style="mix-blend-mode:overlay"/>

    <!-- panes -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#FCFFFF">
      <rect x="56" y="64" width="640" height="190" rx="22" fill="url(#pane)" stroke="url(#edge)" stroke-width="1.5"/>
      <text x="96" y="148" font-size="64" font-weight="500" letter-spacing="-2"><tspan font-style="italic">Hey</tspan>, I’m Eddie Lira.</text>
      <rect x="96" y="186" width="48" height="2" fill="#FCFFFF" opacity="0.8"/>
      <text x="96" y="222" font-size="18" opacity="0.85" letter-spacing="0.5">eddie-lira</text>

      <rect x="56" y="278" width="470" height="86" rx="22" fill="url(#pane)" stroke="url(#edge)" stroke-width="1.5"/>
      <text x="96" y="332" font-size="30" font-weight="500" letter-spacing="-0.5">I’m a software engineer.</text>

      <rect x="900" y="64" width="244" height="300" rx="22" fill="url(#pane)" stroke="url(#edge)" stroke-width="1.5"/>
      <rect x="924" y="88" width="196" height="76" rx="14" fill="#0593C6" stroke="#FCFFFF" stroke-opacity="0.4"/>
      <text x="940" y="134" font-size="20" font-weight="500">Sky Blue</text>
      <text x="1104" y="134" font-size="12" text-anchor="end" opacity="0.85">#0593C6</text>
      <rect x="924" y="176" width="196" height="76" rx="14" fill="#FCFFFF"/>
      <text x="940" y="222" font-size="20" font-weight="500" fill="#0B2A3A">White</text>
      <text x="1104" y="222" font-size="12" text-anchor="end" fill="#0B2A3A" opacity="0.7">#FCFFFF</text>
      <rect x="924" y="264" width="196" height="76" rx="14" fill="#D83995" stroke="#FCFFFF" stroke-opacity="0.4"/>
      <text x="940" y="310" font-size="20" font-weight="500">Hot Pink</text>
      <text x="1104" y="310" font-size="12" text-anchor="end" opacity="0.85">#D83995</text>
    </g>
  </g>
</svg>
